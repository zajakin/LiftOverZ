name: Build LiftOverZ Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'   # кириллица в выводе patch_chains.py не должна падать на Windows (cp1252)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch_label: x64
            asset_name: LiftOverZ-windows.exe
            out_binary: dist/LiftOverZ.exe
            data_sep: ';'
            window_flag: --noconsole
            bin_name: LiftOverZ

          # Консольная сборка для CLI/скриптов: exe с --noconsole (GUI-подсистема) не выводит текст в терминал
          # и не дожидается завершения в .bat-файлах, поэтому для Windows нужен отдельный файл
          - os: windows-latest
            arch_label: x64-cli
            asset_name: LiftOverZ-cli-windows.exe
            out_binary: dist/LiftOverZ-cli.exe
            data_sep: ';'
            window_flag: --console
            bin_name: LiftOverZ-cli

          - os: ubuntu-latest
            arch_label: x64
            asset_name: LiftOverZ-linux
            out_binary: dist/LiftOverZ
            data_sep: ':'
            window_flag: --noconsole
            bin_name: LiftOverZ

          - os: macos-latest
            arch_label: arm64-apple-silicon
            asset_name: LiftOverZ-macos-arm64
            out_binary: dist/LiftOverZ
            data_sep: ':'
            window_flag: --noconsole
            bin_name: LiftOverZ

          - os: macos-15-intel
            arch_label: x86_64-intel
            asset_name: LiftOverZ-macos-intel
            out_binary: dist/LiftOverZ
            data_sep: ':'
            window_flag: --noconsole
            bin_name: LiftOverZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and patch chain files (UCSC)
        # Скачивает недостающие chain-файлы и исправляет в них цепочки chrM; при любой ошибке сборка останавливается
        run: python patch_chains.py

      - name: Build Standalone Executable with PyInstaller
        run: pyinstaller --onefile ${{ matrix.window_flag }} --add-data "locales${{ matrix.data_sep }}locales" --add-data "chains${{ matrix.data_sep }}chains" --collect-all tkinterdnd2 --collect-all pyliftover --collect-all pyfaidx --name ${{ matrix.bin_name }} liftover_gui.py

      - name: Rename executable for Release
        run: mv ${{ matrix.out_binary }} ${{ matrix.asset_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
