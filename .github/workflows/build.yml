name: Build LiftOverZ Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build LiftOverZ on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: LiftOverZ-windows.exe
            out_binary: dist/LiftOverZ.exe
          - os: ubuntu-latest
            asset_name: LiftOverZ-linux
            out_binary: dist/LiftOverZ
          - os: macos-latest
            asset_name: LiftOverZ-macos
            out_binary: dist/LiftOverZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Зависимости для Linux
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev libbz2-dev liblzma-dev zlib1g-dev build-essential samtools

      # Зависимости для macOS
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install samtools

      # Подготовка портативного samtools под Windows через MSYS2
      - name: Setup Samtools for Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-samtools

      - name: Copy Windows Samtools Binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin_win
          cp /c/msys64/mingw64/bin/samtools.exe bin_win/
          cp /c/msys64/mingw64/bin/*.dll bin_win/ 2>/dev/null || true

      # Установка Python пакетов (Linux и macOS)
      - name: Install Python dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Установка Python пакетов (Windows: ставим pybigtools и CrossMap)
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pybigtools tkinterdnd2 pyinstaller numpy
          pip install CrossMap --no-deps

      # Сборка исполняемого файла под Linux/macOS
      - name: Build Standalone Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --noconsole \
            --add-data "locales:locales" \
            --collect-all CrossMap \
            --collect-all pybigtools \
            --collect-all tkinterdnd2 \
            --name LiftOverZ liftover_gui.py

      # Сборка под Windows (с внедрением samtools.exe и локалей)
      - name: Build Standalone Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole \
            --add-data "locales;locales" \
            --add-binary "bin_win/*;." \
            --collect-all CrossMap \
            --collect-all pybigtools \
            --collect-all tkinterdnd2 \
            --name LiftOverZ liftover_gui.py
            
      - name: Rename executable for Release
        shell: bash
        run: |
          mv ${{ matrix.out_binary }} ${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}