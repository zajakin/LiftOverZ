name: Build LiftOverZ Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # Windows 11 / 10 (x64)
          - os: windows-latest
            arch_label: x64
            asset_name: LiftOverZ-windows.exe
            out_binary: dist/LiftOverZ.exe
            data_sep: ';'

          # Linux (x64)
          - os: ubuntu-latest
            arch_label: x64
            asset_name: LiftOverZ-linux
            out_binary: dist/LiftOverZ
            data_sep: ':'

          # macOS Apple Silicon (M1, M2, M3, M4 - arm64)
          - os: macos-latest
            arch_label: arm64-apple-silicon
            asset_name: LiftOverZ-macos-arm64
            out_binary: dist/LiftOverZ
            data_sep: ':'

          # macOS Intel (x86_64)
          - os: macos-15-intel
            arch_label: x86_64-intel
            asset_name: LiftOverZ-macos-intel
            out_binary: dist/LiftOverZ
            data_sep: ':'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Установка системного Tkinter для Linux
      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Сборка одной строкой без разрывов строк обратными слэшами
      - name: Build Standalone Executable with PyInstaller
        run: pyinstaller --onefile --noconsole --add-data "locales${{ matrix.data_sep }}locales" --collect-all tkinterdnd2 --collect-all pyliftover --name LiftOverZ liftover_gui.py

      - name: Rename executable for Release
        run: mv ${{ matrix.out_binary }} ${{ matrix.asset_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  # Публикация релиза со всеми 4 бинарниками
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}