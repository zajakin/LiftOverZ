name: Build LiftOverZ Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build LiftOverZ on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: LiftOverZ-windows.exe
            out_binary: dist/LiftOverZ.exe
          - os: ubuntu-latest
            asset_name: LiftOverZ-linux
            out_binary: dist/LiftOverZ
          - os: macos-latest
            asset_name: LiftOverZ-macos
            out_binary: dist/LiftOverZ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev libbz2-dev liblzma-dev zlib1g-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --noconsole --collect-all CrossMap --collect-all tkinterdnd2 --name LiftOverZ liftover_gui.py

      - name: Rename executable for Release
        shell: bash
        run: |
          mv ${{ matrix.out_binary }} ${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}